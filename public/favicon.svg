<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Gradiente Oficial Partiu Laranja para Dourado/Âmbar -->
    <linearGradient id="partiuOrangeFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="45%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>

    <!-- Gradiente Seta e Friso de Aceleração -->
    <linearGradient id="partiuArrowFavicon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="60%" stop-color="#FF9E00" />
      <stop offset="100%" stop-color="#FFC000" />
    </linearGradient>

    <!-- Gradiente GPS Pin Azul Tecnológico -->
    <linearGradient id="gpsPinGradFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Sombra Suave de Profundidade -->
    <filter id="softGlowFavicon" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF6B00" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fundo sutilmente arredondado com fundo branco para contraste em abas claras e escuras -->
  <rect width="128" height="128" rx="28" fill="#FFFFFF" />
  <rect width="126" height="126" x="1" y="1" rx="27" stroke="#F1F5F9" stroke-width="2" />

  <!-- Símbolo Oficial do PARTIU (P dinâmico + Seta + Pin GPS) -->
  <g transform="translate(1, 4)" filter="url(#softGlowFavicon)">
    <!-- Haste e Loop Dinâmico do 'P' -->
    <path 
      d="M32 105 C26 95 24 75 28 50 C33 26 50 12 75 12 C102 12 118 28 116 52 C114 74 96 88 74 88 C55 88 44 80 38 72 L32 105 Z" 
      fill="url(#partiuOrangeFavicon)" 
    />
    
    <!-- Friso Curvo Superior com Seta de Aceleração -->
    <path 
      d="M55 20 C75 14 96 18 108 30 L125 30 L115 16 L138 28 L115 40 L125 32 C108 32 92 24 70 26 Z" 
      fill="url(#partiuArrowFavicon)" 
    />

    <!-- Pin de GPS Estilizado Centralizado -->
    <path 
      d="M74 38 C68 38 63 43 63 49 C63 58 74 72 74 72 C74 72 85 58 85 49 C85 43 80 38 74 38 Z" 
      fill="url(#gpsPinGradFavicon)" 
    />
    <!-- Orifício do Pin -->
    <circle cx="74" cy="49" r="3.5" fill="#FFFFFF" />

    <!-- Reflexo de Vidro (Highlight) -->
    <path 
      d="M38 48 C42 30 55 20 72 18 C58 24 48 36 44 52 Z" 
      fill="#FFFFFF" 
      opacity="0.6" 
    />
  </g>
</svg>
